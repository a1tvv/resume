<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Repository structure: index.html, style.css, script.js, resume.pdf, assets. No build step — open index.html in the browser or use python3 -m http.server.">
