"21" font-weight="500" fill="#86868b">update date and blocks that appear when you scroll</text><path transform="translate(98 237)" d="M0 2.5A2.5 2.5 0 0 1 2.5 0H12l6 6v16.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 0 22.5z" fill="url(#file)"/><text x="134" y="258" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#f5f5f7">resume.pdf</text><text x="400" y="258" font-size="21" font-weight="500" fill="#86868b">resume to download</text><path transform="translate(92 285)" d="M0 4a3 3 0 0 1 3-3h7.5l3 3.5H27a3 3 0 0 1 3 3V19a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" fill="url(#folder)"/><text x="134" y="304" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#f5f5f7">assets/</text><text x="400" y="304" font-size="21" font-weight="500" fill="#86868b">pictures for README</text><line x1="48" y1="360" x2="1152" y2="360" stroke="#ffffff" stroke-opacity="0.08"/><text x="48" y="402" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>No build step: just open </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">index.html</tspan><tspan> in the browser</tspan></text><text x="48" y="438" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>Or start a server: </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">python3 -m http.server</tspan><tspan> and open </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">localhost:8000</tspan></text>
