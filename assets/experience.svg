<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Опыт. RentUi, 6 месяцев: full-stack разработка, интеграции и деплой, из команды в 12 человек дошёл до финальных двух. Ansar HomeWear / Grand Bazaar, 1,5 месяца: с нуля запустил автоматизацию склада, 80+ позиций, Telegram-бот, проектом пользуются кассиры. Сейчас: открыт к работе — Backend / Django Developer, Project Manager.">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient><linearGradient id="gRent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9fff"/><stop offset="1" stop-color="#0874e0"/></linearGradient><linearGradient id="gAnsar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a66ddb"/><stop offset="1" stop-color="#7c3bb7"/></linearGradient><linearGradient id="gNow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#1e9e47"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="709" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="48" y="44" width="64" height="64" rx="16.64" fill="url(#gRent)"/><rect x="48.5" y="44.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(62.08 58.08) scale(1.4933)"><path d="M12 2.6 1.8 10.4l1.4 1.8L4.5 11.2V21h6v-6h3v6h6v-9.8l1.3 1 1.4-1.8z" fill="#fff"/></g><text x="136" y="72" font-size="28" font-weight="700" letter-spacing="-0.4" fill="#f5f5f7">RentUi</text><text x="136" y="102" font-size="19" font-weight="500" fill="#86868b">Платформа поиска и аренды недвижимости · в продакшене</text><rect x="1034" y="46" width="118" height="36" rx="18.0" fill="#ffffff" fill-opacity="0.08"/><text x="1093.2" y="70.12" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle">6 месяцев</text><circle cx="142" cy="141" r="3.5" fill="#636366"/><text x="160" y="148" font-size="20" font-weight="500" fill="#d1d1d6">Full-stack разработка: схема БД, REST-логика и интерфейс</text><circle cx="142" cy="177" r="3.5" fill="#636366"/><text x="160" y="184" font-size="20" font-weight="500" fill="#d1d1d6">Настроил интеграции сторонних сервисов и деплой на боевой сервер</text><circle cx="142" cy="213" r="3.5" fill="#636366"/><text x="160" y="220" font-size="20" font-weight="500" fill="#d1d1d6">Из стартовой команды в 12 человек дошёл до финального состава из двух</text><rect x="48" y="294" width="64" height="64" rx="16.64" fill="url(#gAnsar)"/><rect x="48.5" y="294.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(62.08 308.08) scale(1.4933)"><path d="M7 7V6a5 5 0 0 1 10 0v1h3.2l-1 15H4.8l-1-15zm2 0h6V6a3 3 0 0 0-6 0z" fill="#fff"/></g><text x="136" y="322" font-size="28" font-weight="700" letter-spacing="-0.4" fill="#f5f5f7">Ansar HomeWear / Grand Bazaar</text><text x="136" y="352" font-size="19" font-weight="500" fill="#86868b">Автоматизация склада для ритейла на базе ИИ</text><rect x="1025" y="296" width="127" height="36" rx="18.0" fill="#ffffff" fill-opacity="0.08"/><text x="1088.4" y="320.12" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle">1,5 месяца</text><circle cx="142" cy="391" r="3.5" fill="#636366"/><text x="160" y="398" font-size="20" font-weight="500" fill="#d1d1d6">С нуля спроектировал и запустил систему автоматизации складского учёта</text><circle cx="142" cy="427" r="3.5" fill="#636366"/><text x="160" y="434" font-size="20" font-weight="500" fill="#d1d1d6">База на 80+ позиций с пагинацией, мобильное управление через Telegram-бота</text><circle cx="142" cy="463" r="3.5" fill="#636366"/><text x="160" y="470" font-size="20" font-weight="500" fill="#d1d1d6">Проект на реальной обкатке — им пользуются кассиры на складе</text><rect x="48" y="544" width="64" height="64" rx="16.64" fill="url(#gNow)"/><rect x="48.5" y="544.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(62.08 558.08) scale(1.4933)"><path fill-rule="evenodd" d="M9 3.5h6A1.5 1.5 0 0 1 16.5 5v1.5H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-10a2 2 0 0 1 2-2h3.5V5A1.5 1.5 0 0 1 9 3.5zm.5 2v1h5v-1z" fill="#fff"/></g><text x="136" y="572" font-size="28" font-weight="700" letter-spacing="-0.4" fill="#f5f5f7">Сейчас</text><text x="136" y="602" font-size="19" font-weight="500" fill="#86868b">Рассматриваю позиции</text><rect x="953" y="546" width="199" height="36" rx="18" fill="#30d158" fill-opacity="0.14"/><circle cx="975.2" cy="564" r="5" fill="#30d158"/><circle cx="975.2" cy="564" r="5" fill="none" stroke="#30d158" stroke-width="2"><animate attributeName="r" values="5;11.0" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="991" y="570" font-size="17" font-weight="600" fill="#30d158">Открыт к работе</text><rect x="136" y="626" width="294" height="40" rx="20.0" fill="#ffffff" fill-opacity="0.08"/><text x="283.0" y="652.48" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Backend / Django Developer</text><rect x="442" y="626" width="183" height="40" rx="20.0" fill="#ffffff" fill-opacity="0.08"/><text x="533.7" y="652.48" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">Project Manager</text><line x1="80" y1="120" x2="80" y2="282" stroke="#3a3a3c" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/><line x1="80" y1="370" x2="80" y2="532" stroke="#3a3a3c" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
