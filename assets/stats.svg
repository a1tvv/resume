<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Довёл до запуска 3 проекта: RentUi, Svet Sunny, Ansar HomeWear. В команде RentUi за 6 месяцев из 12 человек дошёл до финальных двух. Ansar HomeWear — с нуля до склада за 1,5 месяца. 80+ позиций в каталоге.">
<defs><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="0.35" stop-color="#ff375f"/><stop offset="0.7" stop-color="#bf5af2"/><stop offset="1" stop-color="#0a84ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient><linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#ffffff"/><stop offset="1" stop-color="#8e8e93"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter><clipPath id="t1"><rect width="590" height="540" rx="32"/></clipPath></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<g font-weight="600"><g clip-path="url(#t1)"><rect width="590" height="540" fill="url(#tile)"/><circle cx="470" cy="470" r="150" fill="url(#ai)" opacity="0.35" filter="url(#blur)"/></g><rect x="0.5" y="0.5" width="589" height="539" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/><text x="48" y="86" font-size="24" font-weight="600" fill="#86868b">Довёл до запуска</text><text x="30" y="420" font-size="360" font-weight="700" letter-spacing="-10" fill="url(#ai)">3</text><text x="262" y="418" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#titanium)">проекта</text><text x="48" y="490" font-size="22" font-weight="600" fill="#86868b">RentUi · Svet Sunny · Ansar HomeWear</text><rect x="610.5" y="0.5" width="589" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="658" y="86" font-size="24" font-weight="600" fill="#86868b">Команда RentUi</text><text x="650" y="218" font-size="130" font-weight="700" letter-spacing="-4" fill="url(#titanium)" opacity="0.5">12</text><path d="M820 172h40m-15-15 15 15-15 15" fill="none" stroke="#636366" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.6s" fill="freeze"/></path><text x="876" y="218" font-size="130" font-weight="700" letter-spacing="-4" fill="url(#blue)" opacity="0">2<animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.6s" fill="freeze"/></text><text x="1152" y="170" font-size="32" font-weight="700" fill="#f5f5f7" text-anchor="end">6 месяцев</text><text x="1152" y="208" font-size="22" font-weight="600" fill="#86868b" text-anchor="end">дошёл до финала</text><rect x="610.5" y="280.5" width="284" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="646" y="344" font-size="24" font-weight="600" fill="#86868b">Ansar HomeWear</text><text x="644" y="440" font-size="80" font-weight="700" letter-spacing="-2" fill="url(#titanium)">1,5</text><text x="762" y="440" font-size="40" font-weight="700" letter-spacing="-1" fill="url(#titanium)">мес.</text><text x="646" y="490" font-size="22" font-weight="600" fill="#86868b">с нуля до склада</text><rect x="915.5" y="280.5" width="284" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="951" y="344" font-size="24" font-weight="600" fill="#86868b">Каталог склада</text><g font-size="80" font-weight="700" letter-spacing="-2" fill="url(#blue)"><text x="949" y="440" opacity="0">20<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.000;0.250" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="949" y="440" opacity="0">40<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.250;0.500" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="949" y="440" opacity="0">60<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.500;0.750" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="949" y="440">80+<animate attributeName="opacity" values="0;1" keyTimes="0;0.750" calcMode="discrete" dur="0.8s" fill="freeze"/></text></g><text x="951" y="490" font-size="22" font-weight="600" fill="#86868b">позиций в базе</text></g>
</g>
